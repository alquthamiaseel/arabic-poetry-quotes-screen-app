<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Favorite Poems</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <header class="bg-blue-500 text-white p-4 text-center">
      <h1 class="text-2xl">Select Favorite Poems</h1>
    </header>
    <nav class="mt-4 text-center">
      <a class="text-blue-500 hover:underline mx-2" href="index.html">Home</a>
    </nav>
    <main class="p-4">
        <p class="mb-4">Select the poems that inspire you.</p>
        <form class="bg-white p-6 rounded shadow-md">
            <label class="flex items-center mb-2">
                <input type="checkbox" class="mr-2"> Poem 1
            </label>
            <label class="flex items-center mb-2">
                <input type="checkbox" class="mr-2"> Poem 2
            </label>
            <label class="flex items-center mb-2">
                <input type="checkbox" class="mr-2"> Poem 3
            </label>
            <button class="bg-blue-500 text-white w-full p-2 rounded">Save Favorites</button>
        </form>
    </main>
</body>
</html>
