<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <header class="bg-blue-500 text-white p-4 text-center">
      <h1 class="text-2xl">User Registration</h1>
    </header>
    <nav class="mt-4 text-center">
      <a class="text-blue-500 hover:underline mx-2" href="index.html">Home</a>
    </nav>
    <main class="p-4">
        <form class="bg-white p-6 rounded shadow-md">
            <h2 class="text-xl mb-4">Create your account</h2>
            <label class="block mb-2" for="username">Username:</label>
            <input class="border rounded w-full mb-4 p-2" type="text" id="username" placeholder="Enter your username" required />
            <label class="block mb-2" for="password">Password:</label>
            <input class="border rounded w-full mb-4 p-2" type="password" id="password" placeholder="Enter your password" required />
            <button class="bg-blue-500 text-white w-full p-2 rounded">Register</button>
        </form>
    </main>
</body>
</html>
